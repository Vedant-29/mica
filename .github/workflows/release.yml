name: Release

# Tag-driven. Pushing v0.2.0 builds that commit, attaches Mica.dmg to a GitHub
# Release, and the download button on mica.vedantagrw.com starts serving it — it
# points at /releases/latest/download/Mica.dmg, which always resolves to the
# newest published release.
#
# Nothing secret lives in this file. The signing certificate comes from repository
# secrets, which are encrypted, withheld from forks, and masked in logs; a public
# workflow referencing ${{ secrets.X }} gives nothing away on its own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.vedant.mica
      # Repository variable, deliberately not hard-coded: whichever identity signs
      # releases must be one this project actually owns, and it will change if the
      # certificate is ever reissued under a different team.
      SIGN_TEAM_ID: ${{ vars.SIGN_TEAM_ID }}
      # `secrets` is not available in a step-level `if`, so the presence check is
      # hoisted to the job env and tested as a string below.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # BUILD_NUM is `git rev-list --count HEAD`, which needs real history.
          fetch-depth: 0

      # The macos-15 image defaults to an Xcode carrying Swift 6.1, but Package.swift
      # declares tools 6.2 — so the default toolchain refuses to resolve the package.
      # Pick the newest Xcode actually installed rather than pinning a version that
      # will age out of the image.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          swift --version

      - name: Check the tag matches VERSION
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          FILE="$(cat VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v$TAG does not match VERSION ($FILE). Bump VERSION first — see CLAUDE.md."
            exit 1
          fi
          echo "building $FILE"

      - name: Run tests
        run: swift test

      # Without a certificate the build is ad-hoc signed. That installs fine, but macOS
      # derives the signature's designated requirement from the cdhash, which changes on
      # every build — so each update looks like a brand-new app and users re-grant Screen
      # Recording and Accessibility. Adding the secrets keeps those grants across versions.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Select by team ID, not position. The designated requirement is derived from
          # the certificate, so signing with a different identity than local builds use
          # would change it and reset every user's permission grants — exactly what the
          # certificate is here to prevent.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "${SIGN_TEAM_ID:-Apple}" | head -1 | sed -E 's/.*"(.+)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::no codesigning identity matching $SIGN_TEAM_ID in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "using $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Warn that this build is ad-hoc signed
        if: env.HAS_CERT != 'true'
        run: echo "::warning::No MACOS_CERT_P12 secret; building ad-hoc. Users will re-grant permissions on update."

      - name: Build the DMG
        run: |
          # An empty SIGN_IDENTITY falls through to the Makefile's ad-hoc default.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            make dmg SIGN_IDENTITY="$SIGN_IDENTITY" BUNDLE_ID="$BUNDLE_ID"
          else
            make dmg BUNDLE_ID="$BUNDLE_ID"
          fi

      - name: Checksum
        run: shasum -a 256 dist/Mica.dmg | tee dist/Mica.dmg.sha256

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Stated explicitly: on workflow_dispatch `github.ref` is the branch the
          # workflow was dispatched from, not the tag being built, and the action
          # has no tag to attach the release to.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/Mica.dmg
            dist/Mica.dmg.sha256
          generate_release_notes: true
          # The site links to /releases/latest/download/Mica.dmg, which skips
          # prereleases — so a v0.3.0-rc1 tag can be published without moving the
          # download everyone lands on.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
